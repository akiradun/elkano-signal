const EMO={"Dilution / survival event":"💰","Re-rating trigger (geological)":"⛏️","QP / unfunded work program":"📋","Exit-side / M&A":"🤝","Management / team change":"👤","Halt / suspension / distress":"⚠️"};
const esc=(s)=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tick=(e)=>e.ticker?`<span class="tk">${esc(e.exch||'')}:${esc(e.ticker)}</span>`:'<span class="muted">—</span>';
const sig=(e)=>e.cat?`<span class="tag">${EMO[e.cat]||'•'} ${esc(e.cat)}</span>`:'';
const fmtR=(n)=>n==null?'':(n>=1e9?'$'+(n/1e9).toFixed(1)+'B':n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+Math.round(n/1e3)+'K':'$'+n);

document.getElementById('mr').textContent=fmtR(DATA.min_raise);
const T=[["people","👤 People"],["smart","💰 Smart money"],["discovery","⛏️ Discovery"],["acquisitions","🤝 Acquisitions"],["openings","🎯 Openings"],["events","📰 Releases"]];
document.getElementById('tiles').innerHTML=T.map(([k,l])=>`<div class="tile"><div class="n">${DATA.counts[k]!==undefined?DATA.counts[k]:0}</div><div class="l">${l}</div></div>`).join('');
function rows(list,cls){return list.length?list.map(e=>`
  <div class="row ${cls||''}"><div class="s">${e.score||''}</div>
    <div style="flex:1">${e.person?`<span class="pbadge">${esc(e.person)}</span> `:''}<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.title)}</a>
      <div class="sub">${tick(e)} ${sig(e)} ${e['raise']?'<span class="amt">'+fmtR(e['raise'])+'</span>':''} <span class="muted">${e.when||''}</span></div></div>
    ${e.placement==='opening'?'<span class="tag open">OPEN</span>':''}</div>`).join(''):'<div class="sub" style="padding:11px 0">Nothing right now.</div>';}
document.getElementById('people').innerHTML=rows(DATA.people_signals,'person');
document.getElementById('smart').innerHTML=rows(DATA.smart_money);
document.getElementById('disc').innerHTML=rows(DATA.discovery);
document.getElementById('acq').innerHTML=rows(DATA.acquisitions);
document.getElementById('opens').innerHTML=rows(DATA.openings);
document.getElementById('closed').innerHTML=rows(DATA.closing);
function draw(){const f=(document.getElementById('q').value||'').toLowerCase();
  const l=DATA.stream.filter(e=>!f||(e.title+' '+e.ticker+' '+e.exch+' '+(e.cat||'')).toLowerCase().includes(f));
  document.getElementById('stream').innerHTML=l.slice(0,140).map(e=>`<tr><td class="muted" style="white-space:nowrap">${e.when||''}</td><td>${tick(e)}</td>
    <td><a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.title)}</a><div class="sub">${sig(e)} ${e['raise']?'<span class="amt">'+fmtR(e['raise'])+'</span>':''} ${e.placement==='opening'?'<span class="tag open">OPEN</span>':''}</div></td></tr>`).join('')||'<tr><td class="muted">No matches.</td></tr>';}
document.getElementById('q').addEventListener('input',draw); draw();
function showTab(n){document.querySelectorAll('section[data-tab]').forEach(s=>s.hidden=s.dataset.tab!==n);document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));try{history.replaceState(null,'','#'+n);}catch(e){}}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
showTab((location.hash||'#signal').slice(1)||'signal');
