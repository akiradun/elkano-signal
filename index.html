const sig=(e)=>e.cat?`<span class="tag">${EMO[e.cat]||'•'} ${esc(e.cat)}</span>`:'';
const fmtR=(n)=>n==null?'':(n>=1e9?'$'+(n/1e9).toFixed(1)+'B':n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+Math.round(n/1e3)+'K':'$'+n);

function rows(list,cls){return list.length?list.map(e=>`

document.getElementById('q').addEventListener('input',draw); draw();
